# nodesk ayarları
#
# Kurulumda bu dosya /DATA/AppData/nodesk/config.toml olarak kopyalanır.
# Güncellemeler o kopyaya DOKUNMAZ; isimlerin ve ayarların korunur.
# Değişiklikten sonra yeniden başlatma gerekmez: sonraki taramada harita güncellenir.
# Hemen görmek için:  sudo nodesk run  (ya da haritada "Şimdi tara")
#
# Cihaz adı, türü, üst cihazı, etiketleri ve elle servisler artık haritadan da
# düzenlenebilir (karta tıkla -> Düzenle). Haritadaki düzenlemeler bu dosyadakileri ezer.

[general]
oui_file = "/usr/share/arp-scan/ieee-oui.txt"
# Depoda yeni sürüm var mı diye kaç saatte bir bakılsın (0 = hiç bakma)
update_check_hours = 6
# Bu kadar gün görülmeyen cihaz haritadan silinir (uyuyan cihazlar bu sürede gri görünür)
forget_after_days = 14

[ev1]
name = "Ev 1"
interface = "eth0"
gateway_ip = "192.168.44.1"
modem_name = "F1611A modem"
server_name = "home-pi"

[ev2]
name = "Ev 2"
modem_ip = "192.168.1.1"
modem_name = "H3600P modem"
router_name = "home-router"
router_ts_name = "home-router"
lan_dev = "br-lan"

# Docker Compose / CasaOS uygulamalarının haritadaki adı (proje adı = ad).
# Yazılmayanlar CasaOS'taki başlıkla, o da yoksa proje adıyla görünür.
[apps]
"media-app" = "Orbis"

[oracle]
name = "Oracle Cloud"

[mobile]
name = "Uzak / Mobil"
root_name = "Gezgin cihazlar"

# Tailscale cihazlarının hangi gruba ait olduğu (listede olmayanlar "mobile")
[tailscale.site_of]
home-pi = "ev1"
home-router = "ev2"
cloud-arm = "oracle"
cloud-amd-1 = "oracle"
cloud-amd-2 = "oracle"

# ---------------------------------------------------------------------------
# Cihaz adları: MAC adresine göre (IP değişse de isim kalır).
#   name   = haritada görünen ad
#   type   = simge: modem, router, ap, server, laptop, pc, phone, tv, iot,
#            lamp, vacuum, camera, printer, console, device
#   parent = bu cihazı başka bir cihazın altına çiz (o cihazın MAC'i).
#            Örn. extender'a bağlı cihazlar için Keenetic'in MAC'i.
# Telefonlar her Wi-Fi ağı için rastgele MAC kullanır; aynı telefonun iki
# MAC'i görünürse ikisini de aynı adla yazabilirsin.
# ---------------------------------------------------------------------------
[devices]
"self"              = { name = "home-pi", type = "server" }

