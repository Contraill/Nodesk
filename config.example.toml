# Nodesk ileri ayarları
#
# Kurulumda bu dosya <NODESK_HOME>/config.toml olarak kopyalanır. Güncellemeler o kopyaya
# DOKUNMAZ. Çoğu şey artık haritadan ayarlanır; bu dosyaya genelde gerek yoktur:
#   * gruplar (evler, bulut, gezgin cihazlar) ve Tailscale cihazlarının grupları: Ayarlar > Gruplar
#   * cihaz adı, türü, üst cihazı, "aynı cihaz" eşleşmesi: karta tıkla > Düzenle
#   * renkler, erişim, kaynaklar: Ayarlar
# Haritadaki düzenlemeler bu dosyadakileri ezer.

[general]
oui_file = "/usr/share/arp-scan/ieee-oui.txt"
# Depoda yeni sürüm var mı diye kaç saatte bir bakılsın (0 = hiç bakma)
update_check_hours = 6
# Bu kadar gün görülmeyen cihaz haritadan silinir (uyuyan cihazlar bu sürede gri görünür)
forget_after_days = 14
# Ajanların Pi'ye ulaşacağı adres (boşsa Pi'nin Tailscale IP'si kullanılır)
# public_url = "http://100.x.y.z:8088"

# Docker Compose / CasaOS uygulamalarının haritadaki adı (proje adı = ad).
# Yazılmayanlar CasaOS'taki başlıkla, o da yoksa proje adıyla görünür.
[apps]
# "media-app" = "Medya"

# ---------------------------------------------------------------------------
# Cihazlar: MAC adresine göre (IP değişse de kalır). Haritadan da düzenlenebilir.
#   name   = haritada görünen ad
#   type   = modem, router, ap, server, laptop, pc, phone, tablet, tv, iot, lamp,
#            vacuum, camera, printer, console, speaker, nas, device
#   parent = bu cihazı başka bir cihazın altına çiz (o cihazın MAC'i)
# Telefonlar her Wi-Fi ağında ayrı rastgele MAC kullanır: aynı telefonun MAC'lerini aynı adla
# yazarsan tek cihaz olarak görünür.
# ---------------------------------------------------------------------------
[devices]
# "aa:bb:cc:dd:ee:ff" = { name = "Salon TV", type = "tv" }
