"70:54:b4:5a:b6:4e" = { name = "Toshiba TV", type = "tv" }
"b4:e6:2a:c2:32:4a" = { name = "LG TV 1", type = "tv" }
"38:8c:50:9f:be:1c" = { name = "LG TV 2", type = "tv" }
"b0:4a:39:04:a7:c3" = { name = "Roborock", type = "vacuum" }
"54:48:e6:2b:68:ef" = { name = "Yeelight lamba", type = "lamp" }
"d2:61:e5:6d:9a:c3" = { name = "S24", type = "phone" }
"a6:8e:da:14:ea:d0" = { name = "S24", type = "phone" }
