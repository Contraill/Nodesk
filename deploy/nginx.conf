server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Güncellemeden sonra tarayıcı eski sayfayı göstermesin
    add_header Cache-Control "no-cache" always;

    location /live/ {
        add_header Cache-Control "no-store" always;
    }
    location ~ /\. { deny all; }
}
