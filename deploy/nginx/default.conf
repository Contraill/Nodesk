# Nodesk web: statik harita + /api/ -> 127.0.0.1:8089 (Pi'deki nodesk.service)
# Container host ağında çalışır; bu yüzden 127.0.0.1 doğrudan Pi'nin kendisidir.
server {
    listen 8088;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Güncellemeden sonra tarayıcı eski sayfayı göstermesin
    add_header Cache-Control "no-cache" always;

    location /live/ {
        add_header Cache-Control "no-store" always;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8089;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
        client_max_body_size 2m;
    }

    location ~ /\. { deny all; }
}
