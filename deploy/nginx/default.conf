# Nodesk web: static map + /api/ -> 127.0.0.1:8089 (nodesk.service on the Pi)
# The container uses the host network, so 127.0.0.1 is the Pi itself.
server {
    listen 8088;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Do not let browsers show a stale page after an update
    add_header Cache-Control "no-cache" always;

    location /live/ {
        add_header Cache-Control "no-store" always;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8089;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
        client_max_body_size 2m;
    }

    location ~ /\. { deny all; }
}
