# Nodesk web UI. On install and update the `nodesk` tool fills in the @NODESK_HOME@
# placeholder and applies this file to CasaOS (or docker compose). No manual import needed.
#
# The app id is "nodesk-web" on purpose: removing it in CasaOS deletes
# /DATA/AppData/nodesk-web, not the real data folder (and starts the full uninstall).
name: nodesk-web
services:
  web:
    image: nginx:1.27-alpine
    container_name: nodesk-web
    restart: unless-stopped
    # Host network: so /api/ can be proxied to nodesk.service on the Pi (127.0.0.1:8089)
    network_mode: host
    labels:
      nodesk.ports: "8088"
    volumes:
      - @NODESK_HOME@/app/web:/usr/share/nginx/html:ro
      - @NODESK_HOME@/www:/usr/share/nginx/html/live:ro
      # Mounted as a folder: the container sees the new file after a git update
      - @NODESK_HOME@/app/deploy/nginx:/etc/nginx/conf.d:ro
    x-casaos:
      envs: []
      ports:
        - container: "8088"
          description:
            en_us: Web UI
      volumes:
        - container: /usr/share/nginx/html
          description:
            en_us: nodesk web files (git)
x-casaos:
  architectures: [arm64, arm, amd64]
  main: web
  author: nodesk
  developer: nodesk
  category: Network
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/nginx.png
  tagline:
    en_us: Network topology map
  description:
    en_us: Live network topology map for home networks
  title:
    en_us: Nodesk
  index: /
  port_map: "8088"
  scheme: http
