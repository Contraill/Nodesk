name: Demo

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"   # refresh the sample history weekly
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the demo site
        run: |
          mkdir -p _site/live
          cp web/index.html web/icon.svg web/icon.png _site/
          python3 demo/make_demo.py _site/live/data.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
