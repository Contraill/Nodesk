<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nodesk</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23141C24'/%3E%3Cpath d='M8 22h16M11 22V12h10v10M16 12V7' stroke='%235BC8A6' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #EEF1EC; --frame: #F8FAF6; --frame-line: #C3CCC6; --card: #FFFFFF; --card-line: #C9D2CD;
  --text: #17222B; --muted: #5E6C76; --cable: #8C9AA3; --on: #1F9C78; --tail: #5B57D6;
  --relay: #B7801C; --off: #A3ADB3; --exit: #5B57D6; --hl: #E0B020; --panel: #FFFFFF; --danger: #C2412D;
  --field: #F3F5F2; --svcline: #7A9DB0;
  --c-net: #3b82d6; --c-srv: #c2508a; --c-pc: #8e66d0; --c-mobile: #e07b53; --c-media: #d6a03a;
  --c-home: #4f9d69; --c-other: transparent; --c-app: #1e9ab0; --c-sys: #8c9440;
  --shadow: 0 1px 0 rgba(23,34,43,.06), 0 6px 18px rgba(23,34,43,.07);
  --sans: "Barlow Semi Condensed", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141C24; --frame: #18222B; --frame-line: #2E3B47; --card: #1F2A34; --card-line: #33424F;
    --text: #DCE4E8; --muted: #8B9AA6; --cable: #50616E; --on: #5BC8A6; --tail: #8E8CF0;
    --relay: #E6B85C; --off: #55636E; --exit: #8E8CF0; --hl: #F0C94A; --panel: #1B252F; --danger: #F07A63;
    --field: #24303B; --svcline: #4A6D80;
    --shadow: 0 1px 0 rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"] {
  --bg: #141C24; --frame: #18222B; --frame-line: #2E3B47; --card: #1F2A34; --card-line: #33424F;
  --text: #DCE4E8; --muted: #8B9AA6; --cable: #50616E; --on: #5BC8A6; --tail: #8E8CF0;
  --relay: #E6B85C; --off: #55636E; --exit: #8E8CF0; --hl: #F0C94A; --panel: #1B252F; --danger: #F07A63;
  --field: #24303B; --svcline: #4A6D80;
  --shadow: 0 1px 0 rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 15px;
  overflow: hidden; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
#map { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; display: block; }
#map.dragging { cursor: grabbing; }

/* ---------- üst çubuk ---------- */
.bar { position: fixed; top: max(12px, env(safe-area-inset-top)); left: 16px; right: 16px;
  display: flex; gap: 10px; align-items: center; flex-wrap: wrap; pointer-events: none; z-index: 5; }
.bar > * { pointer-events: auto; }
.surface { background: var(--panel); border: 1px solid var(--card-line); border-radius: 10px; box-shadow: var(--shadow); }
.brand { display: flex; align-items: baseline; gap: 10px; padding: 7px 12px; }
.brand h1 { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: -.01em; line-height: 1; }
.brand .meta { color: var(--muted); font-size: 14px; white-space: nowrap; }
.brand .meta b { color: var(--on); font-weight: 600; }
.brand .meta .scanning { color: var(--tail); font-weight: 600; }
.tools { display: flex; gap: 4px; padding: 4px; align-items: center; }
.tools input[type=search] { font-size: 15px; background: transparent; border: 0; width: 170px; padding: 5px 8px; outline: none; }
.tools input[type=search]::placeholder { color: var(--muted); }
.btn { font-size: 14px; font-weight: 500; background: transparent; border: 1px solid transparent;
  border-radius: 7px; padding: 5px 9px; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { background: color-mix(in srgb, var(--text) 7%, transparent); }
.btn[aria-pressed="true"] { border-color: var(--card-line); background: color-mix(in srgb, var(--tail) 14%, transparent); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.line { border-color: var(--card-line); }
.btn.primary { background: var(--text); color: var(--bg); border-color: var(--text); }
.btn.primary:hover { background: color-mix(in srgb, var(--text) 85%, var(--bg)); }
.btn.danger { color: var(--danger); }
.btn svg { flex: none; }
.btn .badge { background: var(--tail); color: var(--bg); border-radius: 9px; font-size: 11.5px; padding: 0 6px; font-weight: 600; }
:focus-visible { outline: 2px solid var(--hl); outline-offset: 2px; }
.sep { width: 1px; align-self: stretch; background: var(--card-line); margin: 3px 2px; }
.spin { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }

.alerts { position: fixed; top: 70px; left: 16px; right: 16px; z-index: 4; pointer-events: none;
  display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
.alerts > * { pointer-events: auto; }
.alert { max-width: 600px; padding: 8px 34px 8px 12px; font-size: 14px; line-height: 1.45; position: relative; border-radius: 10px; box-shadow: var(--shadow); }
.alert.warn { background: color-mix(in srgb, var(--relay) 16%, var(--panel)); border: 1px solid color-mix(in srgb, var(--relay) 50%, transparent); }
.alert.info { background: color-mix(in srgb, var(--tail) 14%, var(--panel)); border: 1px solid color-mix(in srgb, var(--tail) 45%, transparent); }
.alert ul { margin: 4px 0 0; padding-left: 18px; }
.alert .x { position: absolute; top: 4px; right: 4px; padding: 2px 8px; }
.mono { font-family: var(--mono); font-size: .9em; overflow-wrap: anywhere; }

/* ---------- alt köşeler ---------- */
.legend { position: fixed; left: 16px; bottom: max(14px, env(safe-area-inset-bottom)); z-index: 3;
  display: flex; gap: 14px; flex-wrap: wrap; font-size: 13.5px; color: var(--muted);
  background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--card-line);
  border-radius: 10px; padding: 7px 12px; max-width: calc(100% - 100px); }
.legend span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.legend i { display: inline-block; width: 22px; height: 0; border-top: 2px solid; }
.legend b { display: inline-block; width: 16px; height: 12px; border-radius: 3px; border: 1.5px solid var(--c);
  background: color-mix(in srgb, var(--c) 14%, var(--card)); }
.zoom { position: fixed; right: 16px; bottom: max(14px, env(safe-area-inset-bottom)); z-index: 3;
  display: flex; flex-direction: column; padding: 3px; gap: 2px; }
.zoom .btn { justify-content: center; width: 36px; height: 34px; padding: 0; font-size: 18px; }

/* ---------- harita ---------- */
.frame rect.body { fill: var(--frame); stroke: var(--frame-line); stroke-width: 1.2; }
.frame .title { font: 700 30px var(--sans); fill: var(--text); letter-spacing: -.01em; }
.frame .frame-title { cursor: pointer; }
.frame .frame-title:hover { fill: var(--tail); }
.frame .sub { font: 400 14px var(--mono); fill: var(--muted); }
.cable { fill: none; stroke: var(--cable); stroke-width: 1.6; stroke-linejoin: round; }
.cable.off { stroke: var(--off); stroke-dasharray: 3 4; opacity: .7; }
.cable.uplink { stroke-dasharray: 2 5; stroke-linecap: round; opacity: .8; }
.cable.faded { opacity: .15; }
/* Tailnet: gruplar arası bağlar (Pi'den görünen yol: doğrudan / aktarıcı / bağlantı yok) */
.ts-link { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.ts-link.direct { stroke: var(--tail); } .ts-link.relay { stroke: var(--relay); stroke-dasharray: 9 6; }
.ts-link.down { stroke: var(--off); stroke-dasharray: 2 6; }
.ts-port rect { fill: var(--card); stroke-width: 1.5; }
.ts-port text { font: 600 12px var(--sans); }
.ts-bus-label { font: 700 14px var(--sans); }
.ts-label text { font: 600 12px var(--sans); }
.ts-label.direct rect { stroke: var(--tail); } .ts-label.direct text { fill: var(--tail); }
.ts-label.relay rect { stroke: var(--relay); } .ts-label.relay text { fill: var(--relay); }
.ts-label.down rect { stroke: var(--off); } .ts-label.down text { fill: var(--muted); }
.card.ts-dim, .svc-head.ts-dim { opacity: .28; }
.exit { fill: none; stroke: var(--exit); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.exit-flow { fill: none; stroke: var(--bg); stroke-width: 3; stroke-dasharray: 2 34; stroke-linecap: round; animation: flow 1.8s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -36; } }
@media (prefers-reduced-motion: reduce) { .exit-flow { animation: none; } }
.exit-label { font: 600 12px var(--sans); fill: var(--exit); }
.exit-label-bg { fill: var(--bg); stroke: var(--exit); stroke-width: 1.2; }
.exit-chip rect { fill: var(--card); stroke: var(--exit); stroke-width: 1.3; }
.exit-chip text { font: 600 11px var(--sans); fill: var(--exit); }
/* servis grubu başlığı: kutu değil, açılıp kapanan küçük bir hap */
.svc-head { cursor: pointer; outline: none; }
.svc-head { --cat: var(--muted); }
.svc-head rect.pill { fill: color-mix(in srgb, var(--cat) 12%, var(--card)); stroke: color-mix(in srgb, var(--cat) 55%, var(--card-line)); stroke-width: 1.2; }
.svc-head:hover rect.pill { stroke: var(--cat); }
.svc-head:focus-visible rect.pill { stroke: var(--hl); stroke-width: 2.4; }
.svc-head text { font: 600 13.5px var(--sans); fill: var(--text); }
.svc-head .cnt { font: 600 12px var(--sans); fill: var(--muted); }
.svc-head path { stroke: var(--muted); stroke-width: 1.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.svc-head .led { stroke: var(--card); stroke-width: 1.5; }
.meta .unnamed { background: none; border: 0; padding: 0; color: var(--relay); font: inherit; cursor: pointer; text-decoration: underline dotted; }
.card { cursor: pointer; outline: none; }
.card rect.box { fill: var(--card); stroke: var(--card-line); stroke-width: 1.2; }
/* rol rengi: ağ cihazı, sunucu, servis (diğer cihazlar nötr) */
.cat-net { --cat: var(--c-net); } .cat-srv { --cat: var(--c-srv); } .cat-pc { --cat: var(--c-pc); }
.cat-mobile { --cat: var(--c-mobile); } .cat-media { --cat: var(--c-media); } .cat-home { --cat: var(--c-home); }
.cat-other { --cat: var(--c-other); } .cat-app { --cat: var(--c-app); } .cat-sys { --cat: var(--c-sys); }
.card.cat rect.box { fill: color-mix(in srgb, var(--cat) 11%, var(--card)); stroke: color-mix(in srgb, var(--cat) 55%, var(--card-line)); }
/* simge rengi metin rengine doğru karışır: aynı renk açık ve koyu temada okunur kalır */
.card.cat .icon { stroke: color-mix(in oklab, var(--cat) 78%, var(--text)); }
.card:hover rect.box { stroke: var(--text); }
.card.selected rect.box, .card.match rect.box { stroke: var(--hl); stroke-width: 2.4; }
.card.offline { opacity: .55; }
.card.offline rect.box { stroke-dasharray: 4 3; }
.card.dim, .card.offline.dim { opacity: .16; }
.card .name { font: 600 16px var(--sans); fill: var(--text); }
.card .ip { font: 400 12.5px var(--mono); fill: var(--muted); }
.card .icon { fill: none; stroke: var(--text); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.card .led { stroke: var(--card); stroke-width: 2; }
.card .tagdot { font: 600 11px var(--sans); fill: var(--muted); }
.svc-bg { fill: color-mix(in srgb, var(--text) 5%, transparent); }
.svc-group:hover .svc-bg { fill: color-mix(in srgb, var(--text) 10%, transparent); }
.svc-name { font: 500 13px var(--sans); fill: var(--text); }
.svc-group .svc-name { font-weight: 700; }
.svc-port { font: 400 11.5px var(--mono); fill: var(--muted); }
.svc-count { font: 600 11px var(--sans); fill: var(--muted); }
.svc-tree { stroke: var(--card-line); stroke-width: 1.2; fill: none; }
.svc-stopped .svc-name { fill: var(--muted); text-decoration: line-through; }
.card .ts-badge { font: 600 11px var(--sans); }
.cable.svc { stroke: var(--svcline); stroke-width: 1.3; }
.svc-card rect.box { rx: 12; }
.svc-card .tile { fill: color-mix(in srgb, var(--text) 7%, transparent); }
.svc-card .name { font-size: 14.5px; }
.svc-card .icon { stroke-width: 1.7; }
.svc-card.container .name { font-size: 13px; font-weight: 500; }
.svc-card .toggle rect { fill: color-mix(in srgb, var(--text) 8%, transparent); }
.svc-card .toggle:hover rect { fill: color-mix(in srgb, var(--text) 16%, transparent); }
.svc-card .toggle text { font: 600 11.5px var(--sans); fill: var(--muted); }
.svc-card .toggle path { stroke: var(--muted); stroke-width: 1.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.svc-badge { font: 600 11.5px var(--sans); fill: var(--muted); }
.svc-icon-sm { width: 22px; height: 22px; border-radius: 6px; flex: none; }
.colors { display: grid; grid-template-columns: 1fr; gap: 6px; margin: 8px 0 4px; }
.color-row { display: flex; align-items: center; gap: 10px; font-size: 14.5px; }
.color-row input[type=color] { width: 38px; height: 26px; padding: 0; border: 1px solid var(--card-line); border-radius: 6px; background: none; cursor: pointer; }
.color-row input[type=color]:disabled { opacity: .35; cursor: default; }
.color-row .nm { flex: 1; }
.color-row small { color: var(--muted); }
.inet rect { fill: var(--text); } .inet text { font: 700 16px var(--sans); fill: var(--bg); }
.inet .icon { stroke: var(--bg); fill: none; stroke-width: 1.6; }

/* ---------- yan paneller ---------- */
.drawer { position: fixed; top: 0; bottom: 0; width: min(400px, 100%); z-index: 10; background: var(--panel);
  box-shadow: 0 0 30px rgba(0,0,0,.18); overflow-y: auto; transition: transform .22s ease;
  padding: 18px 20px max(24px, env(safe-area-inset-bottom)); }
.drawer.right { right: 0; border-left: 1px solid var(--card-line); transform: translateX(105%); }
.drawer.left { left: 0; border-right: 1px solid var(--card-line); transform: translateX(-105%); width: min(320px, 100%); }
.drawer.open { transform: none; }
@media (prefers-reduced-motion: reduce) { .drawer { transition: none; } }
.drawer h2 { margin: 2px 44px 2px 0; font-size: 28px; line-height: 1.1; font-weight: 700; letter-spacing: -.01em; overflow-wrap: anywhere; }
.drawer .kind { color: var(--muted); font-size: 15px; margin-bottom: 14px; }
.drawer .close { position: absolute; top: 12px; right: 12px; font-size: 22px; line-height: 1; padding: 6px 10px; }
.drawer h3 { font-size: 17px; margin: 22px 0 8px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.drawer h3 .btn { margin-left: auto; font-size: 13.5px; }
.drawer dl { display: grid; grid-template-columns: 116px 1fr; gap: 7px 12px; margin: 0 0 6px; font-size: 15px; }
.drawer dt { color: var(--muted); }
.drawer dd { margin: 0; overflow-wrap: anywhere; }
.drawer dd a { color: var(--tail); text-decoration: none; font-weight: 600; }
.drawer dd a:hover { text-decoration: underline; }
.drawer p.hint, .drawer .note { font-size: 14.5px; line-height: 1.45; color: var(--muted); }
.drawer .note { background: color-mix(in srgb, var(--text) 5%, transparent); border-radius: 8px; padding: 9px 11px; }
.drawer pre { font-family: var(--mono); font-size: 12.5px; white-space: pre-wrap; overflow-wrap: anywhere;
  background: color-mix(in srgb, var(--text) 7%, transparent); border-radius: 8px; padding: 10px 11px; margin: 6px 0; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 13.5px; border: 1px solid var(--card-line); border-radius: 14px; padding: 3px 10px; background: transparent; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
.chip.static { cursor: default; }
.status { display: inline-flex; align-items: center; gap: 7px; }
.status::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--off); flex: none; }
.status.on::before { background: var(--on); } .status.warn::before { background: var(--relay); } .status.bad::before { background: var(--danger); }
.svc-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.svc-list li.grp { font-weight: 600; font-size: 14px; color: var(--muted); margin-top: 6px; align-items: center; gap: 8px; }
.svc-list .grp .btn { padding: 1px 7px; font-size: 12.5px; }
.svc-list li { display: flex; gap: 6px; align-items: stretch; }
.svc-list a, .svc-list span.s { flex: 1; min-width: 0; display: flex; justify-content: space-between; gap: 10px; padding: 7px 10px; border-radius: 7px;
  border: 1px solid var(--card-line); text-decoration: none; color: var(--text); font-size: 15px; }
.svc-list a span em, .svc-list span.s span em { font-style: normal; color: var(--muted); font-size: 13px; margin-left: 6px; }
.svc-list .pen { padding: 0 9px; border: 1px solid var(--card-line); }
.svc-list a:hover { border-color: var(--on); }
.svc-list small { color: var(--muted); font-family: var(--mono); font-size: 12.5px; }
/* formlar */
.field { display: grid; gap: 5px; margin-bottom: 12px; }
.field label, .field .lbl { font-size: 14px; color: var(--muted); }
.field input[type=text], .field input:not([type]), .field select, .field textarea {
  background: var(--field); border: 1px solid var(--card-line); border-radius: 7px; padding: 7px 9px; width: 100%; }
.field textarea { min-height: 64px; resize: vertical; }
.row { display: flex; gap: 6px; align-items: center; }
.row > input { min-width: 0; }
.svc-edit { display: grid; grid-template-columns: 1fr 70px 1fr auto; gap: 6px; margin-bottom: 6px; }
.svc-edit input { background: var(--field); border: 1px solid var(--card-line); border-radius: 7px; padding: 6px 8px; min-width: 0; }
.check { display: flex; align-items: center; gap: 9px; padding: 5px 0; font-size: 15px; }
.check input { width: 17px; height: 17px; accent-color: var(--tail); }
.check small { color: var(--muted); margin-left: auto; text-align: right; font-size: 13px; max-width: 55%; }
.check small.bad { color: var(--danger); }
.err-msg { color: var(--danger); font-size: 14px; min-height: 1em; margin-top: 8px; }
.agent { border: 1px solid var(--card-line); border-radius: 9px; padding: 9px 11px; margin-bottom: 8px; }
.agent header { display: flex; align-items: center; gap: 8px; }
.agent header b { font-size: 15.5px; }
.agent header small { color: var(--muted); }
.agent header .btn { margin-left: auto; padding: 2px 8px; font-size: 13px; }
.scrim { position: fixed; inset: 0; z-index: 9; background: rgba(0,0,0,.25); display: none; }
.scrim.show { display: block; }
@media (max-width: 640px) {
  .brand h1 { font-size: 19px; }
  .brand { flex-wrap: wrap; row-gap: 2px; }
  .brand .meta { white-space: normal; font-size: 13px; }
  .tools input[type=search] { width: 100px; }
  .btn .lbl { display: none; }
  .legend { display: none; }
  .drawer.right { top: auto; width: 100%; max-height: 80vh; border-left: 0; border-top: 1px solid var(--card-line);
    border-radius: 16px 16px 0 0; transform: translateY(105%); }
  .drawer.right.open { transform: none; }
}
</style>
</head>
<body>
<svg id="map" role="img" aria-label="Ağ topolojisi haritası"><g id="world"></g></svg>

<div class="bar">
  <div class="brand surface"><h1>HomeNet</h1><span class="meta" id="meta">yükleniyor…</span></div>
  <div class="tools surface">
    <input type="search" id="q" placeholder="Cihaz, IP, MAC ya da servis" aria-label="Ara">
    <span class="sep"></span>

/* Son 7 günün çevrimiçi şeridi: gün başına 144 dilim (10 dk), UTC günleri */
function historyHtml(h) {
  if (!h) return "";

  let svgs = `<svg width="${lw + W}" height="${days.length * (rh + gap)}" role="img" aria-label="Son 7 günün çevrimiçi geçmişi: yüzde ${h.pct}" style="display:block;max-width:100%">`;

  try { await api("POST", "/api/scan"); } catch (e) { alertBox("warn", "Tarama başlatılamadı: " + e.message); return; }
  scanning(true);
  const started = Date.now();
  const poll = async () => {
    try {
      STATE = await api("GET", "/api/state");
      if (!STATE.scan.running && Date.now() - started > 1500) { scanning(false); await load(true); if ($("#settings").classList.contains("open")) renderSettings(); return; }
    } catch (e) {}
    if (Date.now() - started < 180000) setTimeout(poll, 1500); else scanning(false);
  };
  setTimeout(poll, 1200);
}
function scanning(on) {
  $("#scanIcon").classList.toggle("spin", on); $("#bScan").disabled = on;
  if (on) $("#meta").innerHTML = `<span class="scanning">Taranıyor…</span>`;
}
async function startUpdate() {
  if (!confirm("Nodesk güncellensin mi? Servis yeniden başlar; harita birkaç saniye eski kalabilir.")) return;
  try { await api("POST", "/api/update"); } catch (e) { $("#sErr").textContent = e.message; return; }
  const from = STATE.app.version + (STATE.app.rev || "");
  $("#sUpdate").disabled = true; $("#sUpdate").textContent = "Güncelleniyor…";
  const t0 = Date.now();
  const poll = async () => {
    try { const s = await api("GET", "/api/state"); if (s.app.version + (s.app.rev || "") !== from) { location.reload(); return; } } catch (e) {}
    if (Date.now() - t0 < 300000) setTimeout(poll, 3000);
    else $("#sErr").textContent = "Güncelleme 5 dakikada bitmedi. Pi'de: journalctl -u 'nodesk-update-*' -n 50";
  };
  setTimeout(poll, 5000);
}

/* ---------------- uyarılar ---------------- */
function alertBox(kind, html, key) {
  if (key && prefs.dismissed[key]) return;
  const d = document.createElement("div");
  d.className = `alert ${kind}`; d.innerHTML = html + `<button class="btn x" aria-label="Kapat">×</button>`;
  d.querySelector(".x").onclick = () => { d.remove(); if (key) { prefs.dismissed[key] = 1; savePrefs(); } };
  $("#alerts").appendChild(d); placeAlerts();
}
function placeAlerts() { $("#alerts").style.top = Math.round($(".bar").getBoundingClientRect().bottom + 8) + "px"; }
function updateAlerts() {
  $("#alerts").textContent = "";
  const items = (DATA.errors || []).map(esc).map((e) => e.replace(/(ssh pi@\S+ sudo nodesk router-script \| ssh root@\S+ sh)/, '<span class="mono">$1</span>'));
  const age = (Date.now() - new Date(DATA.generated).getTime()) / 60000;
  const interval = (DATA.settings && DATA.settings.interval_min) || 5;
  if (age > Math.max(15, interval * 3) && (!DATA.settings || DATA.settings.auto)) items.unshift(`Harita ${Math.round(age)} dakikadır güncellenmedi. Pi'de <span class="mono">sudo nodesk status</span> ile kontrol et.`);
  const rs = DATA.router_script || {};
  const autoUpd = !DATA.settings || DATA.settings.agent_auto_update !== false;
  if (rs.ok === false && !(rs.self_update && autoUpd)) items.push(`Router ajanının bu sürümü (${esc(rs.installed)}) kendini güncelleyemiyor. <b>Son kez</b> Laptop'tan çalıştır; sonraki sürümleri kendisi alacak: <span class="mono">ssh pi@100.64.0.1 sudo nodesk router-script | ssh root@100.64.0.2 sh</span>`);
  if (items.length) alertBox("warn", `<b>Dikkat</b><ul>${items.map((i) => `<li>${i}</li>`).join("")}</ul>`, "w:" + items.join("|"));
  const up = DATA.app && DATA.app.update;
  $("#updBadge").hidden = !up;
  if (up) alertBox("info", `Yeni sürüm var: <b>${esc(up.latest)}</b> (şu an ${esc(DATA.app.version)}). Ayarlar → Güncelle.`, "u:" + up.latest);
  if (!API_OK) alertBox("warn", "Nodesk servisine ulaşılamıyor: harita salt okunur. Pi'de <span class=\"mono\">sudo nodesk status</span>.", "noapi:" + new Date().toDateString());
}
function updateMeta() {
  const nodes = DATA.nodes.filter((n) => !n.placeholder && n.kind !== "internet" && !isSvc(n));
  const on = nodes.filter((n) => n.online).length;
  const sv = DATA.nodes.filter((n) => n.kind === "service"), bad = sv.filter((n) => n.health === "fail" || n.health === "partial").length;
  const unnamed = nodes.filter((n) => n.unnamed && !n.hidden).length;
  $("#meta").innerHTML = `<b>${on}</b> / ${nodes.length} cihaz · ${sv.filter((n) => n.online).length} / ${sv.length} servis${bad ? ` · <span style="color:var(--relay)">${bad} yanıt vermiyor</span>` : ""}${unnamed ? ` · <button class="unnamed" id="mUnnamed" title="Adı bilinmeyen cihazları göster">${unnamed} adsız</button>` : ""} · ${esc(ago(DATA.generated))} tarandı`;
  if ($("#mUnnamed")) $("#mUnnamed").onclick = () => { if (CAN_EDIT) openNaming(); else { prefs.filters.unnamed = !prefs.filters.unnamed; afterFilter(); } };
  const a = DATA.app || {};
  $("#meta").title = `Son tarama: ${fmtTime(DATA.generated)}\nNodesk ${a.version || "?"}${a.rev ? " (" + a.rev + ")" : ""}`;
}

/* ---------------- kaydırma / yakınlaştırma ---------------- */
function applyView() { world.setAttribute("transform", `translate(${view.x},${view.y}) scale(${view.k})`); }
function fit() {
  if (!bounds) return;
  const vw = svg.clientWidth, vh = svg.clientHeight, top = vw < 700 ? 130 : 70, bottom = 56;
  if (vw < 700) {   // telefonda enine sığdır, aşağı kaydırılır: kartlar okunur kalsın
    const k = Math.min((vw - 16) / bounds.w, 1.4);
    view = { k, x: (vw - bounds.w * k) / 2, y: top };
  } else {
    const k = Math.min((vw - 32) / bounds.w, (vh - top - bottom) / bounds.h, 1.4);
    view = { k, x: (vw - bounds.w * k) / 2, y: top + (vh - top - bottom - bounds.h * k) / 2 };
  }
  applyView();
}
function zoomAt(f, cx, cy) {
  const k = Math.min(4, Math.max(0.15, view.k * f)); f = k / view.k;
  view.x = cx - (cx - view.x) * f; view.y = cy - (cy - view.y) * f; view.k = k; applyView();
}
const pointers = new Map(); let pinch = null, moved = false, downAt = null;
svg.addEventListener("pointerdown", (e) => {
  svg.setPointerCapture(e.pointerId); pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  moved = false; downAt = { x: e.clientX, y: e.clientY, target: e.target };
  if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) }; }
});
svg.addEventListener("pointermove", (e) => {
  const p = pointers.get(e.pointerId); if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
  if (downAt && Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) > 5) { moved = true; svg.classList.add("dragging"); }
  if (pointers.size === 2 && pinch) { const [a, b] = [...pointers.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y); zoomAt(d / pinch.d, (a.x + b.x) / 2, (a.y + b.y) / 2); pinch.d = d; }
  else if (pointers.size === 1 && moved) { view.x += dx; view.y += dy; applyView(); }
});
function up(e) {
  pointers.delete(e.pointerId); if (pointers.size < 2) pinch = null;
  svg.classList.remove("dragging");
  if (!moved && downAt && pointers.size === 0) {
    const t = downAt.target, tog = t.closest && t.closest(".toggle"), c = t.closest && t.closest(".card");
    const ft = t.closest && t.closest(".frame-title"), hd = t.closest && t.closest(".svc-head");
    if (hd) toggleHead(hd.dataset.head);
    else if (ft) openSitePanel(ft.dataset.site);
    else if (tog && c) toggleNode(c.dataset.id);
    else if (c) openPanel(c.dataset.id);
    else closeDrawers();
  }
  if (pointers.size === 0) downAt = null;
}
function toggleHead(id) {
  prefs.collapsed[id] = !prefs.collapsed[id]; savePrefs(); render();
  const h = document.querySelector(`.svc-head[data-head="${CSS.escape(id)}"]`); if (h) h.focus();
}
function toggleNode(id) {
  const n = byId.get(id); if (!n) return;
  prefs.collapsed[id] = !collapsedNode(n); savePrefs(); render();
}
svg.addEventListener("pointerup", up); svg.addEventListener("pointercancel", up);
svg.addEventListener("wheel", (e) => { e.preventDefault(); zoomAt(Math.exp(-e.deltaY * 0.0015), e.clientX, e.clientY); }, { passive: false });
svg.addEventListener("keydown", (e) => {
  const hd = e.target.closest && e.target.closest(".svc-head");
  if (hd && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); return toggleHead(hd.dataset.head); }
  const c = e.target.closest && e.target.closest(".card");
  if (c && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openPanel(c.dataset.id); }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDrawers(); });

/* ---------------- kontroller ---------------- */
function syncButtons() { $("#tExit").setAttribute("aria-pressed", prefs.exit); $("#tTail").setAttribute("aria-pressed", prefs.tail); $("#tOff").setAttribute("aria-pressed", prefs.off); $("#tSvc").setAttribute("aria-pressed", prefs.svc); }
$("#tSvc").onclick = () => { prefs.svc = !prefs.svc; savePrefs(); syncButtons(); render(); fit(); };
$("#tTail").onclick = () => { prefs.tail = !prefs.tail; savePrefs(); syncButtons(); render(); };
$("#tExit").onclick = () => { prefs.exit = !prefs.exit; savePrefs(); syncButtons(); render(); };
$("#tOff").onclick = () => { prefs.off = !prefs.off; savePrefs(); syncButtons(); render(); fit(); };
$("#bFilter").onclick = () => { if ($("#filters").classList.contains("open")) closeDrawers(); else { renderFilters(); openDrawer("filters"); } };
$("#bSettings").onclick = () => { if ($("#settings").classList.contains("open")) closeDrawers(); else if (!CAN_EDIT) openLogin("Ayarlar için giriş yap."); else openSettings(); };
$("#bLogin").onclick = () => openLogin();
$("#bLogout").onclick = async () => { try { await api("POST", "/api/logout"); } catch (e) {} await probeApi(); await load(true); };
$("#bScan").onclick = scanNow;
$("#zIn").onclick = () => zoomAt(1.25, svg.clientWidth / 2, svg.clientHeight / 2);
$("#zOut").onclick = () => zoomAt(0.8, svg.clientWidth / 2, svg.clientHeight / 2);
$("#zFit").onclick = fit;
$("#scrim").onclick = closeDrawers;
$$("[data-close]").forEach((b) => b.onclick = closeDrawers);
$("#theme").onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("nodesk-theme", next); } catch (e) {}
};
try { const t = localStorage.getItem("nodesk-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
$("#q").addEventListener("input", () => render());
$("#q").addEventListener("keydown", (e) => {
  if (e.key !== "Enter") return;
  const q = e.target.value.trim().toLowerCase(); if (!q) return;
  const n = DATA.nodes.find((x) => x.x !== undefined && x.kind !== "internet" && matches(x, q)); if (!n) return;
  const k = Math.max(view.k, 1);
  view = { k, x: svg.clientWidth / 2 - (n.x + n.cw / 2) * k, y: svg.clientHeight / 2 - (n.y + n.ch / 2) * k };
  applyView(); openPanel(n.id);
});
let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { render(); fit(); placeAlerts(); }, 150); });
syncButtons();

/* ---------------- veri ---------------- */
async function fetchData() {
  // Önce API (harita gizliyse yalnız giriş yapana verir), ulaşılamazsa herkese açık dosya
  try {
    const r = await fetch("/api/data", { cache: "no-store" });
    if (r.status === 401) { const e = new Error("giriş gerekli"); e.login = true; throw e; }
    if (r.ok) return r.json();
  } catch (e) { if (e.login) throw e; }
  const r = await fetch("live/data.json?t=" + Date.now(), { cache: "no-store" });
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}
async function load(force) {
  try {
    const d = await fetchData();
    const changed = force || !DATA || d.generated !== DATA.generated || JSON.stringify(d.nodes).length !== JSON.stringify(DATA.nodes).length;
    DATA = d;
    if (changed) {
      render();
      if (!fitted) { fit(); fitted = true; }
      if (selected && byId.has(selected) && !editing) renderPanel(byId.get(selected));
      else if (selected && !byId.has(selected)) closeDrawers();
      if ($("#filters").classList.contains("open")) renderFilters();
      updateAlerts();
    }
    updateMeta();
    afterFilterBadge();
  } catch (e) {
    if (e.login) { $("#meta").textContent = "harita gizli"; if (!$("#settings").classList.contains("open")) openLogin(); return; }
    $("#meta").textContent = "veri okunamadı";
    $("#alerts").textContent = "";
    alertBox("warn", `<b>Harita verisi okunamadı</b> (${esc(e.message)}). Servis yeni başlamış olabilir; birkaç saniye sonra yenile. Sorun sürerse Pi'de <span class="mono">sudo nodesk status</span>.`);
  }
}
function afterFilterBadge() {
  const f = prefs.filters, c = f.sites.length + f.kinds.length + f.tags.length + (f.status ? 1 : 0) + (f.unnamed ? 1 : 0);
  $("#fCount").hidden = !c; $("#fCount").textContent = c;
}
async function probeApi() {
  try {
    AUTH = await api("GET", "/api/auth"); API_OK = true; CAN_EDIT = AUTH.edit;
    if (AUTH.view) { STATE = await api("GET", "/api/state"); if (STATE.scan.running) scanning(true); }
  } catch (e) { API_OK = false; CAN_EDIT = false; }
  $$("[data-api]").forEach((b) => { b.disabled = !API_OK; });
  $("#bScan").hidden = !CAN_EDIT;
  $("#bLogin").hidden = !API_OK || CAN_EDIT;
  $("#bLogout").hidden = !(AUTH && AUTH.how === "parola");
}
function openLogin(msg) {
  openDrawer("settings");
  $("#sbody").innerHTML = `<h2>Giriş</h2>
    <p class="hint">${esc(msg || (AUTH && !AUTH.view ? "Bu harita gizli; görmek için giriş yap." : "Düzenlemek için giriş yap. Tailscale üzerinden bağlanıyorsan genelde gerekmez."))}</p>
    ${AUTH && !AUTH.password ? `<p class="note">Henüz parola belirlenmemiş. Pi'de <span class="mono">sudo nodesk password</span> ile belirleyebilirsin.</p>` : ""}
    <form id="loginForm"><div class="field"><label for="lPw">Parola</label><input id="lPw" type="password" autocomplete="current-password" required></div>
    <div class="actions"><button class="btn primary" type="submit">Giriş</button></div><div class="err-msg" id="lErr"></div></form>`;
  $("#lPw").focus();
  $("#loginForm").onsubmit = async (e) => {
    e.preventDefault();
    try { await api("POST", "/api/login", { password: $("#lPw").value }); await probeApi(); closeDrawers(); await load(true); }
    catch (err) { $("#lErr").textContent = err.message; }
  };
}
/* Öz-test (adresin sonuna #selftest): kartlar üst üste binmiyor, çizgiler kartların içinden
   geçmiyor, JS hatası yok. Tailnet kapalı ve açıkken bakar; sonucu body[data-selftest]'e yazar
   (tests/test_ui.py başsız Chromium ile okur). */
const JS_ERRORS = [];
addEventListener("error", (e) => JS_ERRORS.push(String(e.message)));
function selfTest() {
  const problems = [], rect = (n) => [n.x, n.y, n.x + n.cw, n.y + n.ch];
  const hit = (r, x0, y0, x1, y1) => Math.max(x0, x1) > r[0] + 1 && Math.min(x0, x1) < r[2] - 1 && Math.max(y0, y1) > r[1] + 1 && Math.min(y0, y1) < r[3] - 1;
  for (const tail of [false, true]) {
    prefs.tail = tail; render();
    const cards = [...ALL.filter((n) => n.x !== undefined && n.kind !== "internet"), ...HEADS];
    for (let i = 0; i < cards.length; i++) for (let j = i + 1; j < cards.length; j++) {
      const a = rect(cards[i]), b = rect(cards[j]);
      if (hit(a, b[0], b[1], b[2], b[3])) problems.push(`üst üste: ${cards[i].id} / ${cards[j].id}`);
    }
    for (const d of DRAWN) for (let k = 1; k < d.pts.length; k++) {
      const [x0, y0] = d.pts[k - 1], [x1, y1] = d.pts[k];
      for (const c of cards) if (!d.ends.includes(c.id) && hit(rect(c), x0, y0, x1, y1))
        problems.push(`${d.kind} çizgisi kartın içinden geçiyor: ${c.id} (${d.ends.join(" → ")})`);
    }
  }
  prefs.tail = false; render();
  document.body.dataset.selftest = JSON.stringify({ ok: !problems.length && !JS_ERRORS.length, problems: [...new Set(problems)].slice(0, 20),
    errors: JS_ERRORS, cards: ALL.filter((n) => n.x !== undefined).length, lines: DRAWN.length });
}
(async () => {
  await probeApi(); await load(true);
  if (location.hash === "#selftest") {
    try { closeDrawers(); selfTest(); }
    catch (e) { document.body.dataset.selftest = JSON.stringify({ ok: false, problems: [], errors: [String(e && e.stack || e)] }); }
    return;
  }
  if (CAN_EDIT && STATE && STATE.settings.setup_done === false && DATA) { openDrawer("settings"); renderWizard(); }
})();
setInterval(() => load(false), 30000);
setInterval(probeApi, 60000);
</script>
