<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nodesk</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23141C24'/%3E%3Cpath d='M8 22h16M11 22V12h10v10M16 12V7' stroke='%235BC8A6' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #EEF1EC; --frame: #F8FAF6; --frame-line: #C3CCC6; --card: #FFFFFF; --card-line: #C9D2CD;
  --text: #17222B; --muted: #5E6C76; --cable: #8C9AA3; --on: #1F9C78; --tail: #5B57D6;
  --relay: #B7801C; --off: #A3ADB3; --exit: #5B57D6; --hl: #E0B020; --panel: #FFFFFF; --danger: #C2412D;
  --field: #F3F5F2; --svcline: #7A9DB0;
  --shadow: 0 1px 0 rgba(23,34,43,.06), 0 6px 18px rgba(23,34,43,.07);
  --sans: "Barlow Semi Condensed", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141C24; --frame: #18222B; --frame-line: #2E3B47; --card: #1F2A34; --card-line: #33424F;
    --text: #DCE4E8; --muted: #8B9AA6; --cable: #50616E; --on: #5BC8A6; --tail: #8E8CF0;
    --relay: #E6B85C; --off: #55636E; --exit: #8E8CF0; --hl: #F0C94A; --panel: #1B252F; --danger: #F07A63;
    --field: #24303B; --svcline: #4A6D80;
    --shadow: 0 1px 0 rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"] {
  --bg: #141C24; --frame: #18222B; --frame-line: #2E3B47; --card: #1F2A34; --card-line: #33424F;
  --text: #DCE4E8; --muted: #8B9AA6; --cable: #50616E; --on: #5BC8A6; --tail: #8E8CF0;
  --relay: #E6B85C; --off: #55636E; --exit: #8E8CF0; --hl: #F0C94A; --panel: #1B252F; --danger: #F07A63;
  --field: #24303B; --svcline: #4A6D80;
  --shadow: 0 1px 0 rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 15px;
  overflow: hidden; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
#map { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; display: block; }
#map.dragging { cursor: grabbing; }

/* ---------- üst çubuk ---------- */
.bar { position: fixed; top: max(12px, env(safe-area-inset-top)); left: 16px; right: 16px;
  display: flex; gap: 10px; align-items: center; flex-wrap: wrap; pointer-events: none; z-index: 5; }
.bar > * { pointer-events: auto; }
.surface { background: var(--panel); border: 1px solid var(--card-line); border-radius: 10px; box-shadow: var(--shadow); }
.brand { display: flex; align-items: baseline; gap: 10px; padding: 7px 12px; }
.brand h1 { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: -.01em; line-height: 1; }
.brand .meta { color: var(--muted); font-size: 14px; white-space: nowrap; }
.brand .meta b { color: var(--on); font-weight: 600; }
.brand .meta .scanning { color: var(--tail); font-weight: 600; }
.tools { display: flex; gap: 4px; padding: 4px; align-items: center; }
.tools input[type=search] { font-size: 15px; background: transparent; border: 0; width: 170px; padding: 5px 8px; outline: none; }
.tools input[type=search]::placeholder { color: var(--muted); }
.btn { font-size: 14px; font-weight: 500; background: transparent; border: 1px solid transparent;
  border-radius: 7px; padding: 5px 9px; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { background: color-mix(in srgb, var(--text) 7%, transparent); }
.btn[aria-pressed="true"] { border-color: var(--card-line); background: color-mix(in srgb, var(--tail) 14%, transparent); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.line { border-color: var(--card-line); }
.btn.primary { background: var(--text); color: var(--bg); border-color: var(--text); }
.btn.primary:hover { background: color-mix(in srgb, var(--text) 85%, var(--bg)); }
.btn.danger { color: var(--danger); }
.btn svg { flex: none; }
.btn .badge { background: var(--tail); color: var(--bg); border-radius: 9px; font-size: 11.5px; padding: 0 6px; font-weight: 600; }
:focus-visible { outline: 2px solid var(--hl); outline-offset: 2px; }
.sep { width: 1px; align-self: stretch; background: var(--card-line); margin: 3px 2px; }
.spin { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }

.alerts { position: fixed; top: 70px; left: 16px; right: 16px; z-index: 4; pointer-events: none;
  display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
.alerts > * { pointer-events: auto; }
.alert { max-width: 600px; padding: 8px 34px 8px 12px; font-size: 14px; line-height: 1.45; position: relative; border-radius: 10px; box-shadow: var(--shadow); }
.alert.warn { background: color-mix(in srgb, var(--relay) 16%, var(--panel)); border: 1px solid color-mix(in srgb, var(--relay) 50%, transparent); }
.alert.info { background: color-mix(in srgb, var(--tail) 14%, var(--panel)); border: 1px solid color-mix(in srgb, var(--tail) 45%, transparent); }
.alert ul { margin: 4px 0 0; padding-left: 18px; }
.alert .x { position: absolute; top: 4px; right: 4px; padding: 2px 8px; }
.mono { font-family: var(--mono); font-size: .9em; overflow-wrap: anywhere; }

/* ---------- alt köşeler ---------- */
.legend { position: fixed; left: 16px; bottom: max(14px, env(safe-area-inset-bottom)); z-index: 3;
  display: flex; gap: 14px; flex-wrap: wrap; font-size: 13.5px; color: var(--muted);
  background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--card-line);
  border-radius: 10px; padding: 7px 12px; max-width: calc(100% - 100px); }
.legend span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.legend i { display: inline-block; width: 22px; height: 0; border-top: 2px solid; }
.zoom { position: fixed; right: 16px; bottom: max(14px, env(safe-area-inset-bottom)); z-index: 3;
  display: flex; flex-direction: column; padding: 3px; gap: 2px; }
.zoom .btn { justify-content: center; width: 36px; height: 34px; padding: 0; font-size: 18px; }

/* ---------- harita ---------- */
.frame rect.body { fill: var(--frame); stroke: var(--frame-line); stroke-width: 1.2; }
.frame .title { font: 700 30px var(--sans); fill: var(--text); letter-spacing: -.01em; }
.frame .sub { font: 400 14px var(--mono); fill: var(--muted); }
.cable { fill: none; stroke: var(--cable); stroke-width: 1.6; stroke-linejoin: round; }
.cable.off { stroke: var(--off); stroke-dasharray: 3 4; opacity: .7; }
.cable.uplink { stroke-dasharray: 2 5; stroke-linecap: round; opacity: .8; }
.cable.faded { opacity: .15; }
.tail { fill: none; stroke-width: 1.4; stroke-dasharray: 6 5; opacity: .75; }
.tail.direct { stroke: var(--tail); } .tail.relay { stroke: var(--relay); } .tail.down { stroke: var(--off); opacity: .45; }
.exit { fill: none; stroke: var(--exit); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.exit-flow { fill: none; stroke: var(--bg); stroke-width: 3; stroke-dasharray: 2 34; stroke-linecap: round; animation: flow 1.8s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -36; } }
@media (prefers-reduced-motion: reduce) { .exit-flow { animation: none; } }
.exit-label { font: 600 13px var(--sans); fill: var(--exit); }
.exit-label-bg { fill: var(--bg); }
.card { cursor: pointer; outline: none; }
.card rect.box { fill: var(--card); stroke: var(--card-line); stroke-width: 1.2; }
.card:hover rect.box { stroke: var(--text); }
.card.selected rect.box, .card.match rect.box { stroke: var(--hl); stroke-width: 2.4; }
.card.offline { opacity: .55; }
.card.offline rect.box { stroke-dasharray: 4 3; }
.card.dim, .card.offline.dim { opacity: .16; }
.card .name { font: 600 16px var(--sans); fill: var(--text); }
.card .ip { font: 400 12.5px var(--mono); fill: var(--muted); }
.card .icon { fill: none; stroke: var(--text); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.card .led { stroke: var(--card); stroke-width: 2; }
.card .tagdot { font: 600 11px var(--sans); fill: var(--muted); }
.svc-bg { fill: color-mix(in srgb, var(--text) 5%, transparent); }
.svc-group:hover .svc-bg { fill: color-mix(in srgb, var(--text) 10%, transparent); }
.svc-name { font: 500 13px var(--sans); fill: var(--text); }
.svc-group .svc-name { font-weight: 700; }
.svc-port { font: 400 11.5px var(--mono); fill: var(--muted); }
.svc-count { font: 600 11px var(--sans); fill: var(--muted); }
.svc-tree { stroke: var(--card-line); stroke-width: 1.2; fill: none; }
.svc-stopped .svc-name { fill: var(--muted); text-decoration: line-through; }
.card .ts-badge { font: 600 11px var(--sans); }
.cable.svc { stroke: var(--svcline); stroke-width: 1.3; }
.svc-card rect.box { rx: 12; }
.svc-card .tile { fill: color-mix(in srgb, var(--text) 7%, transparent); }
.svc-card .name { font-size: 14.5px; }
.svc-card .icon { stroke-width: 1.7; }
.svc-card.container .name { font-size: 13px; font-weight: 500; }
.svc-card .toggle rect { fill: color-mix(in srgb, var(--text) 8%, transparent); }
.svc-card .toggle:hover rect { fill: color-mix(in srgb, var(--text) 16%, transparent); }
.svc-card .toggle text { font: 600 11.5px var(--sans); fill: var(--muted); }
.svc-card .toggle path { stroke: var(--muted); stroke-width: 1.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.svc-badge { font: 600 11.5px var(--sans); fill: var(--muted); }
.svc-icon-sm { width: 22px; height: 22px; border-radius: 6px; flex: none; }
.hub rect { fill: var(--card); stroke: var(--tail); stroke-width: 1.6; }
.hub text { font: 700 16px var(--sans); fill: var(--tail); }
.inet rect { fill: var(--text); } .inet text { font: 700 16px var(--sans); fill: var(--bg); }
.inet .icon { stroke: var(--bg); fill: none; stroke-width: 1.6; }

/* ---------- yan paneller ---------- */
.drawer { position: fixed; top: 0; bottom: 0; width: min(400px, 100%); z-index: 10; background: var(--panel);
  box-shadow: 0 0 30px rgba(0,0,0,.18); overflow-y: auto; transition: transform .22s ease;
  padding: 18px 20px max(24px, env(safe-area-inset-bottom)); }
.drawer.right { right: 0; border-left: 1px solid var(--card-line); transform: translateX(105%); }
.drawer.left { left: 0; border-right: 1px solid var(--card-line); transform: translateX(-105%); width: min(320px, 100%); }
.drawer.open { transform: none; }
@media (prefers-reduced-motion: reduce) { .drawer { transition: none; } }
.drawer h2 { margin: 2px 44px 2px 0; font-size: 28px; line-height: 1.1; font-weight: 700; letter-spacing: -.01em; overflow-wrap: anywhere; }
.drawer .kind { color: var(--muted); font-size: 15px; margin-bottom: 14px; }
.drawer .close { position: absolute; top: 12px; right: 12px; font-size: 22px; line-height: 1; padding: 6px 10px; }
.drawer h3 { font-size: 17px; margin: 22px 0 8px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.drawer h3 .btn { margin-left: auto; font-size: 13.5px; }
.drawer dl { display: grid; grid-template-columns: 116px 1fr; gap: 7px 12px; margin: 0 0 6px; font-size: 15px; }
.drawer dt { color: var(--muted); }
.drawer dd { margin: 0; overflow-wrap: anywhere; }
.drawer dd a { color: var(--tail); text-decoration: none; font-weight: 600; }
.drawer dd a:hover { text-decoration: underline; }
.drawer p.hint, .drawer .note { font-size: 14.5px; line-height: 1.45; color: var(--muted); }
.drawer .note { background: color-mix(in srgb, var(--text) 5%, transparent); border-radius: 8px; padding: 9px 11px; }
.drawer pre { font-family: var(--mono); font-size: 12.5px; white-space: pre-wrap; overflow-wrap: anywhere;
  background: color-mix(in srgb, var(--text) 7%, transparent); border-radius: 8px; padding: 10px 11px; margin: 6px 0; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 13.5px; border: 1px solid var(--card-line); border-radius: 14px; padding: 3px 10px; background: transparent; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
.chip.static { cursor: default; }
.status { display: inline-flex; align-items: center; gap: 7px; }
.status::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--off); flex: none; }
.status.on::before { background: var(--on); } .status.warn::before { background: var(--relay); } .status.bad::before { background: var(--danger); }
.svc-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.svc-list li.grp { font-weight: 600; font-size: 14px; color: var(--muted); margin-top: 6px; align-items: center; gap: 8px; }
.svc-list .grp .btn { padding: 1px 7px; font-size: 12.5px; }
.svc-list li { display: flex; gap: 6px; align-items: stretch; }
.svc-list a, .svc-list span.s { flex: 1; min-width: 0; display: flex; justify-content: space-between; gap: 10px; padding: 7px 10px; border-radius: 7px;
  border: 1px solid var(--card-line); text-decoration: none; color: var(--text); font-size: 15px; }
.svc-list a span em, .svc-list span.s span em { font-style: normal; color: var(--muted); font-size: 13px; margin-left: 6px; }
.svc-list .pen { padding: 0 9px; border: 1px solid var(--card-line); }
.svc-list a:hover { border-color: var(--on); }
.svc-list small { color: var(--muted); font-family: var(--mono); font-size: 12.5px; }
/* formlar */
.field { display: grid; gap: 5px; margin-bottom: 12px; }
.field label, .field .lbl { font-size: 14px; color: var(--muted); }
.field input[type=text], .field input:not([type]), .field select, .field textarea {
  background: var(--field); border: 1px solid var(--card-line); border-radius: 7px; padding: 7px 9px; width: 100%; }
.field textarea { min-height: 64px; resize: vertical; }
.row { display: flex; gap: 6px; align-items: center; }
.row > input { min-width: 0; }
.svc-edit { display: grid; grid-template-columns: 1fr 70px 1fr auto; gap: 6px; margin-bottom: 6px; }
.svc-edit input { background: var(--field); border: 1px solid var(--card-line); border-radius: 7px; padding: 6px 8px; min-width: 0; }
.check { display: flex; align-items: center; gap: 9px; padding: 5px 0; font-size: 15px; }
.check input { width: 17px; height: 17px; accent-color: var(--tail); }
.check small { color: var(--muted); margin-left: auto; text-align: right; font-size: 13px; max-width: 55%; }
.check small.bad { color: var(--danger); }
.err-msg { color: var(--danger); font-size: 14px; min-height: 1em; margin-top: 8px; }
.agent { border: 1px solid var(--card-line); border-radius: 9px; padding: 9px 11px; margin-bottom: 8px; }
.agent header { display: flex; align-items: center; gap: 8px; }
.agent header b { font-size: 15.5px; }
.agent header small { color: var(--muted); }
.agent header .btn { margin-left: auto; padding: 2px 8px; font-size: 13px; }
.scrim { position: fixed; inset: 0; z-index: 9; background: rgba(0,0,0,.25); display: none; }
.scrim.show { display: block; }
@media (max-width: 640px) {
  .brand h1 { font-size: 19px; }
  .brand { flex-wrap: wrap; row-gap: 2px; }
  .brand .meta { white-space: normal; font-size: 13px; }
  .tools input[type=search] { width: 100px; }
  .btn .lbl { display: none; }
  .legend { display: none; }
  .drawer.right { top: auto; width: 100%; max-height: 80vh; border-left: 0; border-top: 1px solid var(--card-line);
    border-radius: 16px 16px 0 0; transform: translateY(105%); }
  .drawer.right.open { transform: none; }
}
</style>
</head>
<body>
<svg id="map" role="img" aria-label="Ağ topolojisi haritası"><g id="world"></g></svg>

<div class="bar">
  <div class="brand surface"><h1>HomeNet</h1><span class="meta" id="meta">yükleniyor…</span></div>
  <div class="tools surface">
    <input type="search" id="q" placeholder="Cihaz, IP, MAC ya da servis" aria-label="Ara">
    <span class="sep"></span>
    <button class="btn" id="bFilter" title="Filtrele"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3h12l-4.5 5.5V13l-3-1.5v-3z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg><span class="lbl">Filtre</span><span class="badge" id="fCount" hidden></span></button>
    <button class="btn" id="tTail" aria-pressed="false" title="Tailscale bağlantılarını göster"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="3" cy="8" r="2" fill="currentColor"/><circle cx="13" cy="3.5" r="2" fill="currentColor"/><circle cx="13" cy="12.5" r="2" fill="currentColor"/><path d="M5 7l6-3M5 9l6 3" stroke="currentColor" stroke-dasharray="2 2" fill="none"/></svg><span class="lbl">Tailnet</span></button>
    <button class="btn" id="tSvc" aria-pressed="true" title="Servisleri göster"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2" width="5" height="5" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="9" y="2" width="5" height="5" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="2" y="9" width="5" height="5" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="9" y="9" width="5" height="5" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.4"/></svg><span class="lbl">Servisler</span></button>
    <button class="btn" id="tOff" aria-pressed="true" title="Şu an görünmeyen cihazları göster"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="12" height="10" rx="2" fill="none" stroke="currentColor" stroke-dasharray="2.5 2"/></svg><span class="lbl">Çevrimdışı</span></button>
    <span class="sep"></span>
    <button class="btn" id="bScan" title="Şimdi tara" data-api><svg id="scanIcon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v3h-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="lbl">Tara</span></button>
    <button class="btn" id="bSettings" title="Ayarlar ve ajanlar" data-api><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span class="lbl">Ayarlar</span><span class="badge" id="updBadge" hidden>1</span></button>
    <button class="btn" id="theme" title="Açık / koyu tema"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 2.5a5.5 5.5 0 0 1 0 11z" fill="currentColor"/></svg></button>
  </div>
</div>
<div class="alerts" id="alerts"></div>

<div class="legend" aria-label="Lejant">
  <span><i style="border-color:var(--cable)"></i>Yerel ağ</span>
  <span><i style="border-color:var(--svcline)"></i>Servis</span>
  <span><i style="border-color:var(--tail);border-top-style:dashed"></i>Tailscale doğrudan</span>
  <span><i style="border-color:var(--relay);border-top-style:dashed"></i>Tailscale aktarıcı</span>
  <span><i style="border-color:var(--exit);border-top-width:3px"></i>Exit node trafiği</span>
</div>
<div class="zoom surface">
  <button class="btn" id="zIn" title="Yakınlaştır" aria-label="Yakınlaştır">+</button>
  <button class="btn" id="zOut" title="Uzaklaştır" aria-label="Uzaklaştır">−</button>
  <button class="btn" id="zFit" title="Ekrana sığdır" aria-label="Ekrana sığdır"><svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4" stroke="currentColor" stroke-width="1.6" fill="none"/></svg></button>
</div>

<div class="scrim" id="scrim"></div>

const ORDER = ["router", "ap", "server", "nas", "cloud-vm", "pc", "laptop", "tv", "console", "speaker", "tablet",

/* ---------------- ölçüler ---------------- */
const SW = 186, SH = 48, KW = 172, KH = 38;
const CW = 200, CH = 52, GX = 22, GY = 46, SPINE = 18, ROWGAP = 10, MAXROWS = 6;
const FRAME_TOP = 58, FRAME_PAD = 26, SITE_GAP = 46;

/* ---------------- durum ---------------- */
let DATA = null, STATE = null, API_OK = false, byId = new Map(), ALL = [], selected = null, editing = false;
const prefs = { tail: false, off: true, svc: true, collapsed: {}, filters: { sites: [], kinds: [], tags: [], status: "", hidden: false }, dismissed: {} };
try { const p = JSON.parse(localStorage.getItem("nodesk-prefs") || "{}"); Object.assign(prefs, p); prefs.filters = Object.assign({ sites: [], kinds: [], tags: [], status: "", hidden: false }, p.filters || {}); } catch (e) {}
const savePrefs = () => { try { localStorage.setItem("nodesk-prefs", JSON.stringify(prefs)); } catch (e) {} };
let view = { x: 0, y: 0, k: 1 }, fitted = false, bounds = null;

/* ---------------- yardımcılar ---------------- */
function el(tag, attrs, parent) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs || {}) if (attrs[k] !== undefined && attrs[k] !== null) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}
function text(parent, x, y, str, cls, extra) { const t = el("text", Object.assign({ x, y, class: cls }, extra || {}), parent); t.textContent = str; return t; }
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function clip(s, n) { s = String(s || ""); return s.length > n ? s.slice(0, n - 1) + "…" : s; }
function ago(iso) {
  if (!iso) return "—";
  const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 90) return "az önce";
  if (s < 3600) return Math.round(s / 60) + " dk önce";
  if (s < 86400 * 2) return Math.round(s / 3600) + " sa önce";
  return Math.round(s / 86400) + " gün önce";
}
function fmtTime(iso) { if (!iso) return "—"; try { return new Date(iso).toLocaleString("tr-TR", { dateStyle: "medium", timeStyle: "short" }); } catch (e) { return iso; } }
function tsPath(n) { const t = n.tailscale; if (!t) return null; if (!t.online) return "down"; if ((t.path || "").startsWith("aktarıcı")) return "relay"; return "direct"; }
function ipNum(ip) { if (!ip) return 1e12; return ip.split(".").reduce((a, b) => a * 256 + (+b || 0), 0); }
function hostFor(n) {
  if (n.id === "self") return location.hostname || (n.ips || [])[0];
  if (n.tailscale && n.tailscale.ip) return n.tailscale.ip;
  return (n.ips || [])[0];
}
async function api(method, path, body) {
  const opt = { method, headers: {} };
  if (method !== "GET") { opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(body || {}); }
  const r = await fetch(path, opt);
  let j = null; try { j = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error((j && j.error) || ("HTTP " + r.status));
  return j;
}
async function copyText(t, btn) {
  try { await navigator.clipboard.writeText(t); btn.textContent = "Kopyalandı"; }
  catch (e) { btn.textContent = "Seçip kopyala"; }
  setTimeout(() => { btn.textContent = "Kopyala"; }, 1800);
}

/* ---------------- servis grupları ---------------- */
function portsLabel(ports) { return ports && ports.length ? ":" + ports.slice(0, 2).join(" :") + (ports.length > 2 ? " …" : "") : ""; }

/* ---------------- yerleşim ---------------- */
function isSvc(n) { return SVC_KINDS.has(n.kind); }
function hasToggle(n) { return n.kind === "svcgroup" || (n.kind === "service" && (n.containers || []).length > 1); }
function collapsedNode(n) { return n.id in prefs.collapsed ? prefs.collapsed[n.id] : n.kind === "svcgroup"; }
function cardW(n) { return n.kind === "container" ? KW : isSvc(n) ? SW : CW; }
function cardH(n) { return n.kind === "container" ? KH : isSvc(n) ? SH : CH; }
function visibleKids(n) {
  if (hasToggle(n) && collapsedNode(n)) return [];
  return (n.kids || []).filter((k) => isVisible(k) || k.kids.some(isVisible));
}
function isVisible(n) {
  if (isSvc(n) && !prefs.svc) return false;
  if (n.hidden && !prefs.filters.hidden) return false;
  if (!prefs.off && !n.online && !MAJOR.has(n.kind) && !n.placeholder) return false;
  return true;
}
function kidSort(a, b) {
  const sa = isSvc(a), sb = isSvc(b);
  if (sa !== sb) return sa ? 1 : -1;                      // önce cihazlar, sonra servisler
  if (sa) {
    if ((a.kind === "svcgroup") !== (b.kind === "svcgroup")) return a.kind === "svcgroup" ? 1 : -1;
    if (a.online !== b.online) return a.online ? -1 : 1;
    return a.label.localeCompare(b.label, "tr");
  }
  const oa = ORDER.indexOf(a.kind), ob = ORDER.indexOf(b.kind);
  if (oa !== ob) return (oa < 0 ? 99 : oa) - (ob < 0 ? 99 : ob);
  if (a.online !== b.online) return a.online ? -1 : 1;
  return ipNum((a.ips || [])[0]) - ipNum((b.ips || [])[0]);
}
function measure(n) {
  n.cw = cardW(n); n.ch = cardH(n);
  const kids = visibleKids(n).sort(kidSort);
  n.blocks = [];
  if (!kids.length) { n.bw = n.cw; n.bh = n.ch; return; }
  const big = kids.filter((k) => visibleKids(k).length || MAJOR.has(k.kind));
  const small = kids.filter((k) => !big.includes(k));
  for (const k of big) { measure(k); n.blocks.push({ type: "node", node: k, w: k.bw, h: k.bh }); }
  for (let i = 0; i < small.length; i += MAXROWS) {
    const items = small.slice(i, i + MAXROWS);
    items.forEach((k) => { k.cw = cardW(k); k.ch = cardH(k); k.blocks = []; });
    const h = items.reduce((s, k) => s + k.ch, 0) + ROWGAP * (items.length - 1);
    n.blocks.push({ type: "col", items, w: Math.max(...items.map((k) => k.cw)) + SPINE, h });
  }
  n.rowW = n.blocks.reduce((s, b) => s + b.w, 0) + GX * (n.blocks.length - 1);
  n.bw = Math.max(n.cw, n.rowW);
  n.bh = n.ch + GY + Math.max(...n.blocks.map((b) => b.h));
}
function place(n, x, y, edges) {
  n.x = x + (n.bw - n.cw) / 2; n.y = y; n.bx = x;
  if (!n.blocks.length) return;
  const px = n.x + n.cw / 2, pb = n.y + n.ch, busY = pb + GY / 2, top = pb + GY;
  let bx = x + (n.bw - n.rowW) / 2;
  for (const b of n.blocks) {
    if (b.type === "node") {
      place(b.node, bx, top, edges);
      edges.push({ d: `M${px},${pb}V${busY}H${b.node.x + b.node.cw / 2}V${top}`, off: !b.node.online, to: b.node });
    } else {
      const sx = bx + 7; let yy = top;
      for (const k of b.items) {
        k.x = bx + SPINE; k.y = yy;
        const my = yy + k.ch / 2, r = 6;
        edges.push({ d: `M${px},${pb}V${busY}H${sx}V${my - r}Q${sx},${my} ${sx + r},${my}H${k.x}`, off: !k.online, to: k });
        yy += k.ch + ROWGAP;
      }
    }
    bx += b.w + GX;
  }
}
function build(data) {
  byId = new Map();
  for (const n of data.nodes) { n.kids = []; delete n.x; delete n._vp; byId.set(n.id, n); }
  // Sadece arayüzde: birden çok sistem servisi "Sistem" grubunda, çok container'lı uygulamaların container'ları alt düğüm
  const extra = [], sys = {};
  for (const n of data.nodes) if (n.kind === "service" && n.source === "system") (sys[n.parent] = sys[n.parent] || []).push(n);
  for (const [host, list] of Object.entries(sys)) {
    const h = byId.get(host);
    if (!h || list.length < 2) continue;
    const g = { id: host + "#sistem", kind: "svcgroup", label: "Sistem", parent: host, site: h.site, host,
      online: list.some((x) => x.online), glyph: "server", members: list.map((x) => x.id), virtual: true,
      ports: [...new Set(list.flatMap((x) => x.ports || []))].sort((a, b) => a - b), ips: [], services: [], tags: [],
      health: list.some((x) => x.health === "fail") ? "partial" : null };
    extra.push(g);
    list.forEach((x) => { x._vp = g.id; });
  }
  for (const n of data.nodes) if (n.kind === "service" && (n.containers || []).length > 1) {
    for (const c of n.containers) extra.push({ id: n.id + "#" + c.name, kind: "container", label: c.name, parent: n.id,
      site: n.site, host: n.host, online: n.online && c.state === "running", state: c.state, status: c.status,
      ports: c.ports || [], image: c.image, glyph: "box", virtual: true, ips: [], services: [], tags: [] });
  }
  for (const n of extra) { n.kids = []; byId.set(n.id, n); }
  ALL = [...data.nodes, ...extra];
  for (const n of ALL) { const p = byId.get(n._vp || n.parent); if (p && p !== n) p.kids.push(n); }
}
function layout() {
  const sites = DATA.sites.map((s) => ({ ...s, roots: DATA.nodes.filter((n) => n.site === s.id && n.parent === "internet") }))
    .filter((s) => s.roots.length);
  for (const s of sites) {
    let w = 0, h = 0;
    for (const r of s.roots) { measure(r); w += r.bw; h = Math.max(h, r.bh); }
    w += GX * (s.roots.length - 1);
    s.w = Math.max(w + FRAME_PAD * 2, 260); s.h = h + FRAME_TOP + FRAME_PAD; s.innerW = w;
  }
  const vw = svg.clientWidth || 1200, vh = (svg.clientHeight || 800) - 90;
  let best = null;
  for (let rows = 1; rows <= Math.min(4, sites.length); rows++) {
    const per = Math.ceil(sites.length / rows), lines = [];
    for (let i = 0; i < sites.length; i += per) lines.push(sites.slice(i, i + per));
    const W = Math.max(...lines.map((l) => l.reduce((s, x) => s + x.w, 0) + SITE_GAP * (l.length - 1)));
    const H = lines.reduce((s, l) => s + Math.max(...l.map((x) => x.h)), 0) + SITE_GAP * (lines.length - 1) + 150;
    const k = Math.min(vw / W, vh / H);
    if (!best || k > best.k * 1.02) best = { k, lines, W };
  }
  const edges = [], frames = [];
  let y = 150;
  for (const line of best.lines) {
    const lw = line.reduce((s, x) => s + x.w, 0) + SITE_GAP * (line.length - 1);
    let x = (best.W - lw) / 2;
    const lh = Math.max(...line.map((s) => s.h));
    for (const s of line) {
      s.x = x; s.y = y; frames.push(s);
      let rx = x + (s.w - s.innerW) / 2;
      for (const r of s.roots) { place(r, rx, y + FRAME_TOP, edges); rx += r.bw + GX; }
      x += s.w + SITE_GAP;
    }
    y += lh + SITE_GAP;
  }
  bounds = { w: best.W, h: y - SITE_GAP };
  return { frames, edges, W: best.W };
}

/* ---------------- filtre ---------------- */
function filterActive() { const f = prefs.filters; return f.sites.length || f.kinds.length || f.tags.length || f.status; }
function passesFilter(n) {
  const f = prefs.filters;
  if (f.sites.length && !f.sites.includes(n.site)) return false;
  if (f.kinds.length && !f.kinds.includes(n.kind)) return false;
  if (f.tags.length && !(n.tags || []).some((t) => f.tags.includes(t))) return false;
  if (f.status === "on" && !n.online) return false;
  if (f.status === "off" && n.online) return false;
  return true;
}
function matches(n, q) {
  const hay = [n.label, n.mac, n.vendor, n.hostname, n.kind, KIND_TR[n.kind], ...(n.ips || []), n.tailscale && n.tailscale.ip,
    ...(n.ports || []), ...(n.containers || []).map((c) => c.name), n.image,
    ...(n.tags || []), ...Object.values(n.names || {}).flat(), ...(n.services || []).flatMap((s) => [s.name, s.app_name, ...(s.ports || [])])]
    .join(" ").toLowerCase();
  return hay.includes(q);
}

/* ---------------- çizim ---------------- */
function render() {
  world.textContent = "";
  if (!DATA) return;
  build(DATA);
  const { frames, edges, W } = layout();
  const gFrames = el("g", {}, world), gUp = el("g", { "pointer-events": "none" }, world), gEdges = el("g", { "pointer-events": "none" }, world);
  const gTail = el("g", { visibility: prefs.tail ? "visible" : "hidden", "pointer-events": "none" }, world);
  const gExit = el("g", { "pointer-events": "none" }, world), gCards = el("g", {}, world);
  const q = $("#q").value.trim().toLowerCase(), fa = filterActive();

  for (const s of frames) {
    const g = el("g", { class: "frame" }, gFrames);
    el("rect", { class: "body", x: s.x, y: s.y, width: s.w, height: s.h, rx: 16 }, g);
    text(g, s.x + 22, s.y + 38, s.name, "title");
    const sub = subnetOf(s);
    if (sub) text(g, s.x + s.w - 20, s.y + 34, sub, "sub", { "text-anchor": "end" });
  }
  const inet = { x: W / 2 - 70, y: 40, w: 140, h: 44 };
  const ig = el("g", { class: "inet" }, gCards);
  el("rect", { x: inet.x, y: inet.y, width: inet.w, height: inet.h, rx: 22 }, ig);
  el("path", { class: "icon", d: ICONS.internet, transform: `translate(${inet.x + 18},${inet.y + 10})` }, ig);
  text(ig, inet.x + 50, inet.y + 28, "İnternet", "");
  for (const s of frames.filter((f) => f.y === frames[0].y)) for (const r of s.roots) {
    const cx = r.x + r.cw / 2, sx = inet.x + inet.w / 2, sy = inet.y + inet.h;
    el("path", { class: "cable uplink", d: `M${sx},${sy}C${sx},${sy + 60} ${cx},${r.y - 70} ${cx},${r.y}` }, gUp);
  }
  const tsNodes = ALL.filter((n) => n.tailscale && n.x !== undefined);
  if (tsNodes.length) {
    const hub = { x: inet.x + inet.w + 60, y: 44, w: 120, h: 36 };
    const hg = el("g", { class: "hub" }, gTail);
    el("rect", { x: hub.x, y: hub.y, width: hub.w, height: hub.h, rx: 18 }, hg);
    text(hg, hub.x + hub.w / 2, hub.y + 24, "Tailnet", "", { "text-anchor": "middle" });

  if (e.key !== "Enter") return;
  const q = e.target.value.trim().toLowerCase(); if (!q) return;
  const n = DATA.nodes.find((x) => x.x !== undefined && x.kind !== "internet" && matches(x, q)); if (!n) return;
  const k = Math.max(view.k, 1);
  view = { k, x: svg.clientWidth / 2 - (n.x + n.cw / 2) * k, y: svg.clientHeight / 2 - (n.y + n.ch / 2) * k };
  applyView(); openPanel(n.id);
});
let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { render(); fit(); placeAlerts(); }, 150); });
syncButtons();

/* ---------------- veri ---------------- */
async function load(force) {
  try {
    const r = await fetch("live/data.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    const changed = force || !DATA || d.generated !== DATA.generated || JSON.stringify(d.nodes).length !== JSON.stringify(DATA.nodes).length;
    DATA = d;
    if (changed) {
      render();
      if (!fitted) { fit(); fitted = true; }
      if (selected && byId.has(selected) && !editing) renderPanel(byId.get(selected));
      else if (selected && !byId.has(selected)) closeDrawers();
      if ($("#filters").classList.contains("open")) renderFilters();
      updateAlerts();
    }
    updateMeta();
    afterFilterBadge();
  } catch (e) {
    $("#meta").textContent = "veri okunamadı";
    $("#alerts").textContent = "";
    alertBox("warn", `<b>Harita verisi okunamadı</b> (${esc(e.message)}). Servis yeni başlamış olabilir; birkaç saniye sonra yenile. Sorun sürerse Pi'de <span class="mono">sudo nodesk status</span>.`);
  }
}
function afterFilterBadge() {
  const f = prefs.filters, c = f.sites.length + f.kinds.length + f.tags.length + (f.status ? 1 : 0);
  $("#fCount").hidden = !c; $("#fCount").textContent = c;
}
async function probeApi() {
  try { STATE = await api("GET", "/api/state"); API_OK = true; if (STATE.scan.running) scanning(true); }
  catch (e) { API_OK = false; }
  $$("[data-api]").forEach((b) => { b.disabled = !API_OK; });
}
(async () => { await probeApi(); await load(true); })();
setInterval(() => load(false), 30000);
setInterval(probeApi, 60000);
</script>
